<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sasha Boruk🍜</title>
  <title>{% block title %}Portfolio{% endblock %}</title>

  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles4.css') }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='images/ramen.gif') }}">

  {% block styles %}{% endblock %}
</head>
<body>
  <div class="legacy-banner">
    You're viewing the 2025 version of this site. <a href="{{ url_for('home') }}">Go to the current site →</a>
  </div>
  <header>
    <h1>Sasha Boruk</h1>
    <p data-en="Student • Developer • Ramen Enthusiast" data-es="Estudiante • Desarrollador • Entusiasta del Ramen"> Student • Developer • Ramen Enthusiast
    </p>
  </header>

  <nav>
    <a href="{{ url_for('legacy.home') }}" data-en="Home" data-es="Acerca de mí"> Home</a>
    <a href="{{ url_for('legacy.projects') }}" data-en="Projects" data-es="Proyectos"> Projects</a>
    <a href="{{ url_for('legacy.experience') }}" data-en="Experience" data-es="Experiencia laboral"> About</a>
    <a href="{{ url_for('legacy.bloom') }}" data-en="Bloom Log" data-es="Bloom Log"> Bloom Log</a>
    <button id="theme-toggle">⏾</button>
    <button id="language-toggle" onclick="toggleLanguage()">EN/ES</button>
  </nav>

  <main>
    {% block content %}{% endblock %}
  </main>


    <div class="social-media">
      <div class="social-links">
        <a href="mailto:sboruk@uwaterloo.ca" class="social-link" target="_blank" aria-label="Email"><i class="fas fa-envelope social-icon"></i></a>
        <a href="https://github.com/alebora" class="social-link" target="_blank" aria-label="Github"><i class="fab fa-github social-icon"></i></a>
        <a href="https://www.linkedin.com/in/sashaboruk" class="social-link" target="_blank" aria-label="Linkedin"><i class="fab fa-linkedin social-icon"></i></a>
        <div class="webring">
          <a class="webring-nav" href="https://cs.uwatering.com/#https://boruksasha.pythonanywhere.com/?nav=prev"> ‹ </a>
          <a class="webring-nav logo-link" href="https://cs.uwatering.com/#https://boruksasha.pythonanywhere.com/." target="_blank">
            <img class="webring-icon" src="https://cs.uwatering.com/icon.black.svg" alt="CS Webring" />
          </a>
          <a class="webring-nav" href="https://cs.uwatering.com/#https://boruksasha.pythonanywhere.com/?nav=next"> › </a>
        </div>
      </div>
    </div>

    

    <p class="copyright"> &copy; 2026 Sasha Boruk</p>

  <script src="{{ url_for('static', filename='js/scripts.js') }}">
    const toggleButton = document.getElementById('theme-toggle');
    const body = document.body;

    toggleButton.addEventListener('click', () => {
      body.classList.toggle('dark');
      localStorage.setItem('theme', body.classList.contains('dark') ? 'dark' : 'light');
    });

    // Persist theme on reload
    window.addEventListener('DOMContentLoaded', () => {
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme === 'dark') {
        body.classList.add('dark');
      }
    });

  </script>

  <div id="robot-pet">
    <img id="robot-img" src="{{ url_for('static', filename='images/robot1.gif') }}" alt="robot gif">
  </div>

  <script src="{{ url_for('static', filename='js/scripts.js') }}"></script>

</body>
</html>
